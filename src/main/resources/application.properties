spring.application.name=unifio-rag-agent
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# modelo de embedding (trocar exige reindexar: DROP TABLE institutional_embeddings, reiniciar e reenviar os PDFs)
# opcoes: nomic-embed-text (768), bge-m3 (1024); a dimensao tem que acompanhar o modelo
# bge-m3-cpu = bge-m3 com "PARAMETER num_gpu 0" (ollama create bge-m3-cpu -f Modelfile.bge-m3-cpu): mesmos vetores,
# mas fica na CPU e não tira o qwen3 da GPU (8 GB não comportam os dois). Ingestão do PPC: ~52 s na GPU → ~3 min na CPU
unifio.embedding.model=bge-m3-cpu
unifio.embedding.dimension=1024

# modelo de chat (pode trocar sem reindexar)
# para voltar ao llama3.1, basta descomentar a linha de baixo (a ultima definicao vale)
unifio.chat.model=qwen3:8b
#unifio.chat.model=llama3.1

# postgres do docker-compose: o PgVectorEmbeddingStore tem conexão própria (LangChainConfig);
# esta é só para o JdbcTemplate que lista os documentos (GET /institutional-documents)
spring.datasource.url=jdbc:postgresql://localhost:5432/ragdb
spring.datasource.username=rag
spring.datasource.password=rag

# kafka (Marco 7): container do docker-compose (docker compose up -d kafka)
# earliest: na primeira subida o grupo le o topico desde o inicio, sem perder uploads
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=rag-ingestion
spring.kafka.consumer.auto-offset-reset=earliest
app.upload-dir=uploads
